# Docker Compose for production deployment
version: '3.8'

services:
  spotify-bot:
    build: .
    network_mode: "host"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1

  backup:
    build: .
    network_mode: "host"
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - ./backups:/app/backups
    command: bash /app/scripts/run_backup_cron.sh
    environment:
      - PYTHONUNBUFFERED=1
